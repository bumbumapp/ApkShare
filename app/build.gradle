plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsPropsFile = rootProject.file('ads.properties')
if (hmsAdsPropsFile.exists()) hmsAdsPropsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', HMS_TEST_BANNER_ID)
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', HMS_TEST_INTERSTITIAL_ID)

android {
    namespace 'com.bumbumapps.sharing.appsapk'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.sharing.appsapk"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "5.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildTypes {
        debug {
            // Google test ads in debug builds.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~8492118014"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/7542639051"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/8324597058"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation "io.reactivex.rxjava2:rxjava:2.2.21"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
